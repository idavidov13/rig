# Plan morning-digest § 3–4, ADR 0003. Saves /digest/2026-10-28 as one HTML file and deploys it
# to GitHub Pages as an artifact, so the preview never lands in the repo. Run with marker=false
# to upload the same page over the same link without the lane marker.
name: preview

on:
  workflow_dispatch:
    inputs:
      marker:
        description: Show the lane marker in the banner
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Save /digest/2026-10-28
        env:
          LANE_MARKER: ${{ inputs.marker && secrets.LANE_MARKER || '' }}
          PORT: 8787
        run: |
          mkdir -p _site
          pnpm start &
          for i in $(seq 30); do curl -fs localhost:8787/health && break; sleep 1; done
          curl -fsS localhost:8787/digest/2026-10-28 -o _site/index.html
          grep -o '<span class="marker">[^<]*' _site/index.html | sed 's/.*>//; s/\(....\).*/\1…/'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
